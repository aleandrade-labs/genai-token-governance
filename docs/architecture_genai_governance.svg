  <rect x="900" y="130" width="260" height="600" rx="16" fill="#1e293b" stroke="#FBBC04" stroke-width="2" filter="url(#dropShadow)" />
  <rect x="900" y="130" width="260" height="40" rx="16" fill="url(#gcpYellow)" />
  <text x="920" y="156" fill="#1e293b" font-size="14" font-weight="700">5. EXECUTIVE BI &amp; ALERTS</text>

  <!-- Looker Studio Dashboard Box -->
  <g transform="translate(920, 190)">
    <rect width="220" height="340" rx="12" fill="#0f172a" stroke="#FBBC04" stroke-width="1.5" />
    <rect x="15" y="15" width="190" height="35" rx="6" fill="#1e293b" />
    <text x="110" y="38" fill="#fde047" font-size="12" text-anchor="middle" font-weight="bold">📊 Looker Studio Dashboard</text>
    
    <!-- Mini scorecards -->
    <rect x="15" y="60" width="90" height="50" rx="6" fill="#1e293b" />
    <text x="60" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">Total Tokens</text>
    <text x="60" y="98" fill="#60a5fa" font-size="12" text-anchor="middle" font-weight="bold">556.8 M</text>

    <rect x="115" y="60" width="90" height="50" rx="6" fill="#1e293b" />
    <text x="160" y="80" fill="#94a3b8" font-size="9" text-anchor="middle">Est. Cost</text>
    <text x="160" y="98" fill="#4ade80" font-size="12" text-anchor="middle" font-weight="bold">$ 175.09</text>

    <!-- Mini chart -->
    <rect x="15" y="120" width="190" height="100" rx="6" fill="#1e293b" />
    <text x="25" y="140" fill="#e2e8f0" font-size="10" font-weight="bold">Top Consumer Leaderboard</text>
    <text x="25" y="160" fill="#94a3b8" font-size="9">1. admin@altostrat.com</text>
    <text x="25" y="178" fill="#94a3b8" font-size="9">2. alexandrade@google.com</text>
    <text x="25" y="196" fill="#94a3b8" font-size="9">3. sa-finops-governance@...</text>

    <!-- Mini Donut -->
    <rect x="15" y="230" width="190" height="85" rx="6" fill="#1e293b" />
    <text x="25" y="250" fill="#e2e8f0" font-size="10" font-weight="bold">Model Family Breakdown</text>
    <text x="25" y="270" fill="#38bdf8" font-size="9">■ Flash: 68%</text>
    <text x="90" y="270" fill="#f87171" font-size="9">■ Pro: 20%</text>
    <text x="150" y="270" fill="#c084fc" font-size="9">■ Sonnet: 3%</text>
    <text x="25" y="295" fill="#4ade80" font-size="9">■ SAP Cost Centers: 100% Attributed</text>
  </g>

  <!-- Google Chat Card Alert -->
  <g transform="translate(920, 550)">
    <rect width="220" height="150" rx="10" fill="#0f172a" stroke="#EA4335" stroke-width="1.5" />
    <text x="15" y="26" fill="#f87171" font-size="12" font-weight="bold">💬 Google Chat Proactive Alert</text>
    <rect x="15" y="38" width="190" height="98" rx="6" fill="#1e293b" />
    <text x="25" y="58" fill="#fbbf24" font-size="9" font-weight="bold">⚠️ [FinOps Budget Notice]</text>
    <text x="25" y="74" fill="#e2e8f0" font-size="9">User: admin@altostrat.com</text>
    <text x="25" y="90" fill="#94a3b8" font-size="9">App: smart_grid_assistant</text>
    <text x="25" y="106" fill="#38bdf8" font-size="9">Tokens: 30,338 | Cost: &lt;$0.01</text>
    <text x="25" y="122" fill="#4ade80" font-size="9">Status: Verified Real-Time Stream</text>
  </g>

  <!-- CONNECTOR ARROWS -->
  <!-- 1. User -> Agent -->
  <path d="M 240 245 L 320 245" stroke="#4285F4" stroke-width="2.5" marker-end="url(#arrowBlue)" />
  <path d="M 240 365 L 280 365 L 280 270 L 320 270" stroke="#4285F4" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- 2. Agent <-> Tool -->
  <path d="M 440 310 L 440 335" stroke="#FBBC04" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowYellow)" />
  <path d="M 460 335 L 460 310" stroke="#FBBC04" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowYellow)" />

  <!-- 3. Agent <-> Vertex AI -->
  <path d="M 560 230 L 640 230" stroke="#EA4335" stroke-width="2.5" marker-end="url(#arrowRed)" />
  <path d="M 560 270 L 600 270 L 600 330 L 640 330" stroke="#EA4335" stroke-width="2" marker-end="url(#arrowRed)" />

  <!-- 4. Agent -> BigQuery Plugin -->
  <path d="M 440 310 L 440 450" stroke="#34A853" stroke-width="3" marker-end="url(#arrowGreen)" />

  <!-- 5. BigQuery Plugin -> BigQuery Table -->
  <path d="M 560 515 L 640 515" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrowBlue)" />

  <!-- 6. BigQuery Views -> Looker Studio -->
  <path d="M 840 600 L 920 340" stroke="#FBBC04" stroke-width="2.5" marker-end="url(#arrowYellow)" />
  
  <!-- 7. BigQuery Views -> Google Chat -->
  <path d="M 840 650 L 920 650" stroke="#EA4335" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRed)" />

</svg>
