<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" style="background-color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gcpBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1967D2" />
    </linearGradient>
    <linearGradient id="gcpGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#137333" />
    </linearGradient>
    <linearGradient id="gcpYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC04" />
      <stop offset="100%" stop-color="#E37400" />
    </linearGradient>
    <linearGradient id="gcpRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#C5221F" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Markers -->
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4285F4" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34A853" />
    </marker>
    <marker id="arrowYellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBC04" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#EA4335" />
    </marker>
  </defs>

  <!-- Title Header -->
  <rect x="40" y="30" width="1120" height="70" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#dropShadow)" />
  <text x="70" y="65" fill="#f8fafc" font-size="20" font-weight="700">Google Cloud FinOps — GenAI Token &amp; Cost Governance Architecture</text>
  <text x="70" y="85" fill="#94a3b8" font-size="13">Sub-Second Real-Time Observability with Official Google ADK &amp; BigQuery Storage Write API (adk.dev)</text>

  <!-- SECTION 1: Callers -->
  <rect x="40" y="130" width="220" height="600" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />
  <rect x="40" y="130" width="220" height="40" rx="16" fill="#334155" />
  <text x="60" y="156" fill="#f8fafc" font-size="14" font-weight="700">1. ENTERPRISE USERS</text>

  <!-- User Card 1 -->
  <g transform="translate(60, 200)">
    <rect width="180" height="90" rx="10" fill="#0f172a" stroke="#4285F4" stroke-width="1.5" />
    <circle cx="30" cy="35" r="14" fill="url(#gcpBlue)" />
    <text x="30" y="40" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="bold">👤</text>
    <text x="52" y="32" fill="#f8fafc" font-size="12" font-weight="bold">Admin / DevOps</text>
    <text x="52" y="48" fill="#94a3b8" font-size="10">admin@altostrat.com</text>
    <rect x="15" y="62" width="150" height="18" rx="4" fill="#1e293b" />
    <text x="90" y="75" fill="#38bdf8" font-size="9" text-anchor="middle">ADC Quota Project Auth</text>
  </g>

  <!-- User Card 2 -->
  <g transform="translate(60, 320)">
    <rect width="180" height="90" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <circle cx="30" cy="35" r="14" fill="#334155" />
    <text x="30" y="40" fill="#ffffff" font-size="12" text-anchor="middle">👥</text>
    <text x="52" y="32" fill="#f8fafc" font-size="12" font-weight="bold">Enterprise Teams</text>
    <text x="52" y="48" fill="#94a3b8" font-size="10">SAC, Grid, P&amp;D Callers</text>
    <rect x="15" y="62" width="150" height="18" rx="4" fill="#1e293b" />
    <text x="90" y="75" fill="#a855f7" font-size="9" text-anchor="middle">SAP Cost Center Tagged</text>
  </g>

  <!-- SECTION 2: ADK Agent Engine -->
  <rect x="300" y="130" width="280" height="600" rx="16" fill="#1e293b" stroke="#34A853" stroke-width="2" filter="url(#dropShadow)" />
  <rect x="300" y="130" width="280" height="40" rx="16" fill="url(#gcpGreen)" />
  <text x="320" y="156" fill="#ffffff" font-size="14" font-weight="700">2. GOOGLE ADK RUNTIME (adk.dev)</text>

  <!-- ADK Agent Box -->
  <g transform="translate(320, 190)">
    <rect width="240" height="120" rx="10" fill="#0f172a" stroke="#34A853" stroke-width="1.5" />
    <text x="15" y="30" fill="#4ade80" font-size="14" font-weight="bold">🤖 InMemoryRunner</text>
    <text x="15" y="50" fill="#e2e8f0" font-size="12">Agent: smart_grid_assistant</text>
    <text x="15" y="70" fill="#94a3b8" font-size="10">• Multi-Turn Reasoning Loop</text>
    <text x="15" y="86" fill="#94a3b8" font-size="10">• Autonomous Function Calling</text>
    <text x="15" y="102" fill="#94a3b8" font-size="10">• Zero API Key Authentication</text>
  </g>

  <!-- SCADA Tool Box -->
  <g transform="translate(320, 335)">
    <rect width="240" height="90" rx="10" fill="#0f172a" stroke="#FBBC04" stroke-width="1.5" />
    <text x="15" y="28" fill="#fde047" font-size="13" font-weight="bold">⚡ SCADA Substation Tool</text>
    <text x="15" y="48" fill="#94a3b8" font-size="11">query_substation_status()</text>
    <text x="15" y="68" fill="#cbd5e1" font-size="10">Telemetry: 138kV | Load: 74.2%</text>
  </g>

  <!-- BigQuery Plugin Box -->
  <g transform="translate(320, 450)">
    <rect width="240" height="130" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <text x="15" y="30" fill="#38bdf8" font-size="13" font-weight="bold">📦 BigQuery Agent Analytics</text>
    <text x="15" y="50" fill="#e2e8f0" font-size="11">BigQueryAgentAnalyticsPlugin</text>
    <rect x="15" y="60" width="210" height="22" rx="4" fill="#0369a1" />
    <text x="120" y="75" fill="#ffffff" font-size="10" text-anchor="middle" font-weight="bold">gRPC Storage Write API</text>
