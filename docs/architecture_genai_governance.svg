  <g transform="translate(640, 290)">
    <rect width="200" height="85" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="15" y="28" fill="#cbd5e1" font-size="13" font-weight="bold">Gemini 1.5 Pro</text>
    <text x="15" y="48" fill="#94a3b8" font-size="10">• Complex Multi-Hop RAG</text>
