    <text x="15" y="45" fill="#94a3b8" font-size="10">genai_finops_governance.adk_events</text>
  </g>

  <g transform="translate(640, 560)">
    <rect width="200" height="150" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="15" y="24" fill="#cbd5e1" font-size="11" font-weight="bold">6 Pre-Calculated Views</text>
    <text x="15" y="46" fill="#94a3b8" font-size="10">📊 v_adk_executive_kpis</text>
    <text x="15" y="68" fill="#94a3b8" font-size="10">👤 v_adk_user_leaderboard</text>
    <text x="15" y="90" fill="#94a3b8" font-size="10">🤖 v_adk_model_distribution</text>
    <text x="15" y="112" fill="#94a3b8" font-size="10">🏢 v_adk_cost_center_attribution</text>
    <text x="15" y="134" fill="#94a3b8" font-size="10">⚡ v_adk_tool_analytics</text>
  </g>

