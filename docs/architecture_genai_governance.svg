    <text x="32" y="82" fill="#202124" font-size="13" font-weight="700" text-anchor="middle">Google ADK Agent</text>
    <text x="32" y="98" fill="#5f6368" font-size="11.5" text-anchor="middle">Multi-Agent Runner</text>
